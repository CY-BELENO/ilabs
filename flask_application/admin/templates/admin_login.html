<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - PUP Lab System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="admin/static/css/style.css">
    <link rel="stylesheet" href="admin/static/css/style_admin_login.css">
</head>
<body>
    <div class="admin-login-page-wrapper">
        <div class="admin-login-container">
            <div class="admin-login-card">
                <div class="admin-login-header">
                    <i class="fas fa-user-shield"></i>
                    <h3>Administrator Access</h3>
                    <p class="mb-0">Super Admin Authentication</p>
                </div>
                
                <div class="admin-login-body">
                    <div class="admin-login-form">
                        <form id="adminLoginForm">
                            <div class="mb-4">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-user-circle" style="color: #0d6efd;"></i> Admin Username
                                </label>
                                <input type="text" class="form-control" id="adminUsername" 
                                       placeholder="Enter admin username" required>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-lock" style="color: #0d6efd;"></i> Password
                                </label>
                                <input type="password" class="form-control" id="adminPassword" 
                                       placeholder="Enter your password" required>
                            </div>
                            
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">Remember me</label>
                            </div>
                            
                            <button type="submit" class="btn btn-admin w-100 btn-lg mb-4">
                                <i class="fas fa-sign-in-alt"></i> Login as Administrator
                            </button>
                            
                            <div class="text-center">
                                <a href="index.html" class="back-btn">
                                    <i class="fas fa-arrow-left"></i> Back to Home
                                </a>
                            </div>
                        </form>
                    </div>
                    
                    <div class="admin-login-instruction">
                        <h6><i class="fas fa-info-circle"></i> Admin Credentials:</h6>
                        <ul>
                            <li><strong>Username:</strong> admin</li>
                            <li><strong>Password:</strong> admin123</li>
                            <li>For security, change default password after first login</li>
                            <li>Contact system administrator for password reset</li>
                        </ul>
                    </div>
                </div>
                
                <div class="admin-login-footer">
                    <i class="fas fa-university"></i>
                    <strong>iLABS</strong><br>
                    Institute of Technology • Administrative Control Panel
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Admin Login Script -->
    <script src="admin/static/js/admin_login.js"></script>
</body>
</html>
